/* Layout: one practice sheet on graph paper. Header with live stats, a settings strip, then a single question card that turns into a results card. */
:root {
  --paper: #EFF3F8;
  --grid: rgba(29, 79, 168, .07);
  --grid-major: rgba(29, 79, 168, .13);
  --card: #FFFFFF;
  --ink: #101C33;
  --ink-soft: #4B5A73;
  --line: #C8D2E0;
  --accent: #1D4FA8;
  --accent-ink: #FFFFFF;
  --accent-wash: #E4ECF9;
  --good: #0F7A57;
  --good-wash: #E0F3EA;
  --bad: #B0332E;
  --bad-wash: #FBE6E4;
  --font-math: 'STIX Two Text', 'Cambria Math', 'Times New Roman', serif;
  --font-ui: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D1524;
    --grid: rgba(120, 160, 230, .07);
    --grid-major: rgba(120, 160, 230, .13);
    --card: #142038;
    --ink: #E7EEF9;
    --ink-soft: #9DAAC2;
    --line: #2B3B59;
    --accent: #7AAEFF;
    --accent-ink: #0A1428;
    --accent-wash: #1C2E52;
    --good: #52D1A5;
    --good-wash: #12372D;
    --bad: #FF8F88;
    --bad-wash: #42201F;
    color-scheme: dark;
  }
}

  --accent-wash: #1C2E52;
  --good: #52D1A5;
  --good-wash: #12372D;
  --bad: #FF8F88;
  --bad-wash: #42201F;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid-major) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
  color: var(--ink);
  font: 16px/1.5 var(--font-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
.wrap { max-width: 860px; margin: 0 auto; display: grid; gap: 18px; }
.col { display: grid; gap: 18px; min-width: 0; align-content: start; }

/* header */
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 14px 28px; }
.kicker { margin: 0 0 6px; font: 500 12px/1.2 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
h1 { margin: 0; font: 600 clamp(32px, 6.5vw, 46px)/1.05 var(--font-math); text-wrap: balance; }
.stats { display: flex; gap: 28px; margin: 0; }
.stats div { display: grid; gap: 2px; }
.stats dt { font: 500 11px/1.2 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
.stats dd { margin: 0; font: 600 30px/1.1 var(--font-math); font-variant-numeric: tabular-nums; }

/* settings */
.controls { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px 28px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; }
.group { display: grid; gap: 7px; min-width: 0; }
.group.topics { flex: 1 1 100%; }
.glabel { margin: 0; font: 500 11px/1.2 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: 500 14px/1.2 var(--font-ui); padding: 8px 13px; border: 1.5px solid var(--line); background: var(--card);
  color: var(--ink); border-radius: 6px; cursor: pointer;
}
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.seg { display: inline-flex; }
.seg .chip { border-radius: 0; margin-left: -1.5px; }
.seg .chip:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
.seg .chip:last-child { border-radius: 0 6px 6px 0; }
.seg .chip[aria-pressed="true"] { position: relative; z-index: 1; }
select {
  font: 500 14px/1.2 var(--font-ui); padding: 9px 10px; border: 1.5px solid var(--line); background: var(--card);
  color: var(--ink); border-radius: 6px;
}
.btn { font: 600 15px/1.2 var(--font-ui); padding: 11px 18px; border-radius: 6px; border: 1.5px solid transparent; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--accent); }
.ctl-actions { margin-left: auto; display: flex; flex-wrap: wrap; gap: 10px; }
.btn[aria-expanded="true"] { background: var(--accent-wash); border-color: var(--accent); }
:is(.chip, select, .btn, .opt, .k, .hr, .calc-x):focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* question card */
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 6px;
  padding: clamp(18px, 4vw, 32px); box-shadow: 0 14px 30px -22px rgba(16, 28, 51, .45);
}
.progress { display: flex; align-items: center; gap: 16px; }
.pips { list-style: none; display: flex; gap: 4px; margin: 0; padding: 0; flex: 1; min-width: 0; }
.pip { flex: 1; height: 6px; background: var(--line); border-radius: 1px; }
.pip.ok { background: var(--good); }
.pip.no { background: var(--bad); }
.pip.cur { outline: 2px solid var(--accent); outline-offset: 1.5px; }
.count { margin: 0; font: 500 13px/1 var(--font-mono); color: var(--ink-soft); white-space: nowrap; }
.count b { color: var(--ink); font-weight: 500; }
.ask { margin: 26px 0 0; font: 500 17px/1.4 var(--font-ui); color: var(--ink-soft); }
.ask i, .glabel i { font-family: var(--font-math); font-size: 1.12em; color: var(--ink); }
.equation {
  font-family: var(--font-math); font-size: clamp(28px, 7.4vw, 48px); line-height: 1.3;
  padding: 14px 0 28px; overflow-x: auto; white-space: nowrap;
}
.equation i, .val i, .math i, .sub i { font-style: italic; }
.story { padding: 18px 0 26px; max-width: 64ch; }
.story p { margin: 0 0 12px; font: 400 clamp(18px, 3.6vw, 21px)/1.55 var(--font-ui); }
.story .storyq { font-weight: 600; margin-bottom: 0; }
.story .note { font: 500 11px/1.2 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
sup { font-size: .62em; line-height: 0; }
.sys { display: inline-flex; align-items: center; gap: .2em; }
.brace { font-size: 2.5em; line-height: .8; font-weight: 300; color: var(--ink-soft); }
.lines { display: grid; gap: .1em; }
.lines > span { display: block; }

.options { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 560px) { .options { grid-template-columns: 1fr 1fr; } }
.opt {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px;
  min-height: 62px; padding: 12px 14px; text-align: left; font: inherit; color: var(--ink);
  background: var(--card); border: 1.5px solid var(--line); border-radius: 6px; cursor: pointer;
}
.opt:not([aria-disabled="true"]):hover { border-color: var(--accent); background: var(--accent-wash); }
.opt[aria-disabled="true"] { cursor: default; }
.key {
  display: grid; place-items: center; width: 28px; height: 28px; border: 1.5px solid var(--line); border-radius: 4px;
  font: 500 13px/1 var(--font-mono); color: var(--ink-soft);
}
.val { font-family: var(--font-math); font-size: 24px; line-height: 1.2; overflow-x: auto; white-space: nowrap; }
.tag { font: 500 11px/1.2 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; }
.opt.right { border-color: var(--good); background: var(--good-wash); }
.opt.right .tag, .opt.right .key { color: var(--good); border-color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-wash); }
.opt.wrong .tag, .opt.wrong .key { color: var(--bad); border-color: var(--bad); }
.hint { margin: 14px 0 0; font-size: 13px; color: var(--ink-soft); }
@media (hover: hover) { .touch { display: none; } }
@media (hover: none) { .kbd { display: none; } }

/* feedback */
.feedback { margin-top: 22px; padding-top: 18px; border-top: 1px dashed var(--line); }
.feedback h2 { margin: 0 0 14px; font: 600 19px/1.3 var(--font-ui); }
.feedback.good h2 { color: var(--good); }
.feedback.bad h2 { color: var(--bad); }
.feedback h2 i { font-family: var(--font-math); font-size: 1.1em; }
.steps { list-style: none; counter-reset: step; margin: 8px 0 20px; padding: 0; }
.steps li {
  counter-increment: step; display: grid; grid-template-columns: 28px minmax(0, 1fr) minmax(0, auto);
  gap: 4px 12px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--line);
}
.steps li::before { content: counter(step); font: 500 13px/1 var(--font-mono); color: var(--ink-soft); }
.steps li.solo .say { grid-column: 2 / -1; }
.say { font-size: 15px; color: var(--ink-soft); }
.say i { font-family: var(--font-math); font-size: 1.12em; color: var(--ink); }
.math { font-family: var(--font-math); font-size: 23px; line-height: 1.3; text-align: right; white-space: nowrap; overflow-x: auto; }
@media (max-width: 559px) {
  .steps li { grid-template-columns: 28px minmax(0, 1fr); }
  .steps .math { grid-column: 2; text-align: left; }
}

/* results */
.big { margin: 8px 0 4px; font: 600 clamp(60px, 15vw, 100px)/1 var(--font-math); font-variant-numeric: tabular-nums; }
.big .of { font-size: .42em; font-weight: 400; color: var(--ink-soft); margin-left: .25em; }
.sub { margin: 0; color: var(--ink-soft); }
.subhead { margin: 28px 0 0; font: 600 17px/1.3 var(--font-ui); }
.missed { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 12px; }
.missed li { border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; display: grid; gap: 6px; min-width: 0; }
.missed .q { font: 400 13px/1.4 var(--font-ui); color: var(--ink-soft); margin: 0; }
.missed .q i { font-family: var(--font-math); font-size: 1.12em; color: var(--ink); }
.missed .eqs { font-family: var(--font-math); font-size: 26px; line-height: 1.3; overflow-x: auto; white-space: nowrap; }
.missed .eqs.wordtxt { font: 400 16px/1.5 var(--font-ui); white-space: normal; }
.missed .cmp { margin: 0; font-size: 14px; color: var(--ink-soft); }
.missed .cmp .math { display: inline; font-size: 19px; }
.missed .bad { color: var(--bad); }
.missed .good { color: var(--good); }
.perfect { margin: 24px 0 0; font-size: 17px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }

/* calculator */
.calc { display: none; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 14px; box-shadow: 0 14px 30px -22px rgba(16, 28, 51, .45); }
body.calc-open .calc { display: block; }
.calc-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.calc-x { font: 500 13px/1.2 var(--font-ui); background: none; border: 1.5px solid var(--line); color: var(--ink); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.calc-x:hover { border-color: var(--accent); }
.calc-screen { background: var(--paper); border: 1.5px solid var(--line); border-radius: 6px; padding: 8px 12px; margin-bottom: 10px; }
.calc-screen:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.calc-in { display: block; width: 100%; min-width: 0; border: 0; background: transparent; color: var(--ink); font: 400 26px/1.3 var(--font-math); text-align: right; outline: none; padding: 0; }
.calc-in::placeholder { color: var(--ink-soft); }
.calc-out { display: block; min-height: 24px; text-align: right; font: 400 17px/1.4 var(--font-math); color: var(--ink-soft); }
.calc-hist { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 2px; }
.calc-hist:empty { display: none; }
.calc-hist li { display: flex; justify-content: space-between; gap: 12px; font: 400 15px/1.4 var(--font-math); color: var(--ink-soft); }
.calc-hist .he { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.hr { font: inherit; color: var(--ink); background: none; border: 0; padding: 0 2px; cursor: pointer; text-decoration: underline dotted; white-space: nowrap; }
.calc-keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.k { min-height: 46px; padding: 0; font: 400 22px/1 var(--font-math); background: var(--card); color: var(--ink); border: 1.5px solid var(--line); border-radius: 6px; cursor: pointer; }
.k:hover { border-color: var(--accent); }
.k:active { background: var(--accent-wash); }
.k.fn { color: var(--ink-soft); font-size: 20px; }
.k.op { background: var(--accent-wash); }
.k.eqk { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
@media (min-width: 1040px) {
  body.calc-open .wrap { max-width: 1200px; grid-template-columns: minmax(0, 1fr) 316px; align-items: start; }
  .calc { position: sticky; top: 20px; }
}
@media (max-width: 1039px) {
  .calc {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; max-width: 420px; margin: 0 auto;
    max-height: 82vh; overflow-y: auto; border-radius: 10px 10px 0 0;
    padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
    padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -10px 30px -12px rgba(0, 0, 0, .35);
  }
  body.calc-open { padding-bottom: calc(var(--calc-h, 440px) + 16px); }
  .calc { padding-top: 10px; }
  .calc-head { margin-bottom: 8px; }
  .calc-screen { padding: 6px 10px; margin-bottom: 8px; }
  .calc-in { font-size: 22px; }
  .calc-out { min-height: 22px; font-size: 16px; }
  .calc-hist { margin-bottom: 8px; }
  .calc-hist li:nth-child(n+2) { display: none; }
  .calc-keys { gap: 5px; }
  .k { min-height: 40px; font-size: 20px; }
}

@media (prefers-reduced-motion: no-preference) {
  .opt, .chip, .btn { transition: border-color .12s, background-color .12s, filter .12s; }
}

<body>
<div class="wrap">
  <div class="col">
  <header class="top">
    <div>
      <p class="kicker" id="kicker">Practice sheet</p>
      <h1>Equation Drill</h1>
    </div>
    <dl class="stats" aria-label="Round stats">
      <div><dt>Score</dt><dd id="st-score">0</dd></div>
      <div><dt>Streak</dt><dd id="st-streak">0</dd></div>
      <div><dt>Accuracy</dt><dd id="st-acc">&mdash;</dd></div>
    </dl>
  </header>

  <section class="controls" aria-label="Practice settings">
    <div class="group topics">
      <span class="glabel" id="gl-topic">Topic</span>
      <div class="chips" id="topics" role="group" aria-labelledby="gl-topic"></div>
    </div>
    <div class="group">
      <span class="glabel" id="gl-level">Level</span>
      <div class="seg" id="levels" role="group" aria-labelledby="gl-level"></div>
    </div>
    <div class="group">
      <label class="glabel" for="len">Questions</label>
      <select id="len">
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="20">20</option>
      </select>
    </div>
    <div class="ctl-actions">
      <button class="btn ghost" id="calc-toggle" type="button" aria-expanded="false" aria-controls="calc">Calculator</button>
      <button class="btn ghost" id="new" type="button">New round</button>
    </div>
  </section>

  <main class="card" id="card"></main>
  </div>

  <aside class="calc" id="calc" aria-label="Calculator">
    <div class="calc-head">
      <span class="glabel">Calculator</span>
      <button type="button" class="calc-x" id="calc-close">Close</button>
    </div>
    <div class="calc-screen">
      <input id="calc-in" class="calc-in" type="text" inputmode="none" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="0" aria-label="Expression">
      <output id="calc-out" class="calc-out" for="calc-in"></output>
    </div>
    <ul class="calc-hist" id="calc-hist" aria-label="Recent results"></ul>
    <div class="calc-keys" id="calc-keys"></div>
  </aside>
</div>

<script>
(function () {
  'use strict';

  /* ==LOGIC-START== */
  const M = '−';
  const VARS = ['x', 'y'];
  const PAIRS = [['x', 'y']];
  const SQ = '<sup>2</sup>';

  const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const nz = (a, b) => { let n = 0; while (n === 0) n = rnd(a, b); return n; };
  const shuffle = (a) => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = rnd(0, i); const t = r[i]; r[i] = r[j]; r[j] = t; } return r; };
  const fmt = (n) => (n < 0 ? M + (-n) : String(n));
  const V = (n) => '<i>' + n + '</i>';
  const par = (n) => '(' + fmt(n) + ')';

  function join(parts) {
    let out = '';
    parts.forEach((p, i) => {
      if (i === 0) out = (p.neg ? M : '') + p.body;
      else out += ' ' + (p.neg ? M : '+') + ' ' + p.body;
    });
    return out;
  }
  function poly(terms) {
    const parts = terms.filter((t) => t.c !== 0).map((t) => {
      const a = Math.abs(t.c);
      return { neg: t.c < 0, body: t.v ? (a === 1 ? '' : String(a)) + t.v : String(a) };
    });
    return join(parts) || '0';
  }
  const moveSay = (b) => (b > 0 ? 'Subtract ' + b + ' from both sides' : 'Add ' + (-b) + ' to both sides');
  const moveSayV = (c, vh) => (c > 0
    ? 'Subtract ' + poly([{ c: c, v: vh }]) + ' from both sides'
    : 'Add ' + poly([{ c: -c, v: vh }]) + ' to both sides');

  function buildOpts(correct, cands, filler) {
    const used = new Set([correct.key]);
    const picked = [];
    for (const c of shuffle(cands)) {
      if (picked.length >= 3) break;
      if (!used.has(c.key)) { used.add(c.key); picked.push(c); }
    }
    let guard = 0;
    while (picked.length < 3 && guard++ < 200) {
      const c = filler();
      if (!used.has(c.key)) { used.add(c.key); picked.push(c); }
    }
    const all = shuffle([{ key: correct.key, html: correct.html, ok: true }].concat(
      picked.map((p) => ({ key: p.key, html: p.html, ok: false }))));
    return { options: all.map((o) => ({ html: o.html })), correctIndex: all.findIndex((o) => o.ok) };
  }
  function numOpts(label, ans, cands) {
    const mk = (n) => ({ key: String(n), html: label + fmt(n) });
    return buildOpts(mk(ans),
      cands.filter((c) => Number.isInteger(c)).map(mk),
      () => mk(ans + pick([-1, 1]) * rnd(1, 6)));
  }

  function genTwoStep(d) {
    const v = pick(VARS);
    let a, b, x0;
    if (d === 1) { a = rnd(2, 6); b = rnd(1, 12); x0 = rnd(1, 9); }
    else if (d === 2) { a = pick([-1, 1]) * rnd(2, 9); b = nz(-15, 15); x0 = nz(-10, 10); }
    else { a = pick([-1, 1]) * rnd(2, 12); b = nz(-30, 30); x0 = nz(-15, 15); }
    const c = a * x0 + b;
    const o = numOpts(V(v) + ' = ', x0, [(c + b) / a, c - b, -x0, x0 + 1, x0 - 1, c / a]);
    return Object.assign({
      ask: 'Solve for ' + V(v),
      prompt: poly([{ c: a, v: V(v) }, { c: b, v: '' }]) + ' = ' + fmt(c),
      steps: [
        { say: moveSay(b), eq: poly([{ c: a, v: V(v) }]) + ' = ' + fmt(c - b) },
        { say: 'Divide both sides by ' + fmt(a), eq: V(v) + ' = ' + fmt(x0) }
      ]
    }, o);
  }

  function genBoth(d) {
    const v = pick(VARS);
    let a, c, b, x0;
    if (d === 1) { a = rnd(3, 9); c = rnd(1, a - 1); b = rnd(1, 10); x0 = rnd(1, 9); }
    else if (d === 2) { a = rnd(2, 9); do { c = nz(-6, 8); } while (c === a); b = nz(-12, 12); x0 = nz(-9, 9); }
    else { a = nz(-12, 12); do { c = nz(-12, 12); } while (c === a); b = nz(-20, 20); x0 = nz(-12, 12); }
    const e = a * x0 + b - c * x0;
    const k = a - c;
    const steps = [
      { say: moveSayV(c, V(v)), eq: poly([{ c: k, v: V(v) }, { c: b, v: '' }]) + ' = ' + fmt(e) },
      { say: moveSay(b), eq: poly([{ c: k, v: V(v) }]) + ' = ' + fmt(e - b) },
      { say: 'Divide both sides by ' + fmt(k), eq: V(v) + ' = ' + fmt(x0) }
    ];
    if (k === 1) steps.pop();
    const o = numOpts(V(v) + ' = ', x0, [(b - e) / k, (e - b) / (a + c), (e + b) / k, x0 + 1, x0 - 1]);
    return Object.assign({
      ask: 'Solve for ' + V(v),
      prompt: poly([{ c: a, v: V(v) }, { c: b, v: '' }]) + ' = ' + poly([{ c: c, v: V(v) }, { c: e, v: '' }]),
      steps: steps
    }, o);
  }

  function genBrackets(d) {
    const v = pick(VARS);
    let a, b, x0, e = 0;
    if (d === 1) { a = rnd(2, 6); b = rnd(1, 8); x0 = rnd(1, 9); }
    else if (d === 2) { a = pick([-1, 1]) * rnd(2, 7); b = nz(-9, 9); x0 = nz(-9, 9); }
    else { a = pick([-1, 1]) * rnd(2, 9); b = nz(-12, 12); x0 = nz(-12, 12); e = nz(-20, 20); }
    const f = a * (x0 + b) + e;
    const inner = '(' + V(v) + ' ' + (b < 0 ? M : '+') + ' ' + Math.abs(b) + ')';
    const lhs = fmt(a) + inner + (e ? ' ' + (e < 0 ? M : '+') + ' ' + Math.abs(e) : '');
    const steps = [];
    if (e) steps.push({ say: moveSay(e), eq: fmt(a) + inner + ' = ' + fmt(f - e) });
    steps.push({ say: 'Divide both sides by ' + fmt(a), eq: V(v) + ' ' + (b < 0 ? M : '+') + ' ' + Math.abs(b) + ' = ' + fmt(x0 + b) });
    steps.push({ say: moveSay(b), eq: V(v) + ' = ' + fmt(x0) });
    const o = numOpts(V(v) + ' = ', x0, [x0 + b, x0 + 2 * b, -x0, x0 - b, x0 + 1, x0 - 1]);
    return Object.assign({ ask: 'Solve for ' + V(v), prompt: lhs + ' = ' + fmt(f), steps: steps }, o);
  }

  function genSubst(d) {
    const pq = pick(PAIRS), p = pq[0], q = pq[1];
    let pv, qv, spec;
    if (d === 1) {
      pv = rnd(1, 6); qv = rnd(1, 6);
      spec = [{ c: rnd(2, 7), k: 'p' }, { c: nz(-6, 6), k: 'q' }, { c: nz(-12, 12), k: '' }];
    } else if (d === 2) {
      pv = nz(-5, 5); qv = nz(-6, 6);
      spec = [{ c: pick([-1, 1]) * rnd(1, 5), k: 'p2' }, { c: nz(-7, 7), k: 'q' }, { c: nz(-15, 15), k: '' }];
    } else {
      pv = nz(-4, 4); qv = nz(-4, 4);
      spec = [{ c: nz(-4, 5), k: 'p2' }, { c: nz(-6, 6), k: 'pq' }, { c: nz(-5, 5), k: 'q2' }];
    }
    const K = {
      p: { sym: V(p), sub: par(pv), val: pv },
      q: { sym: V(q), sub: par(qv), val: qv },
      p2: { sym: V(p) + SQ, sub: par(pv) + SQ, val: pv * pv },
      q2: { sym: V(q) + SQ, sub: par(qv) + SQ, val: qv * qv },
      pq: { sym: V(p) + V(q), sub: par(pv) + par(qv), val: pv * qv },
      '': { sym: '', sub: '', val: 1 }
    };
    const terms = spec.map((s) => ({ c: s.c, k: s.k, val: s.c * K[s.k].val }));
    const total = terms.reduce((s, t) => s + t.val, 0);
    const prompt = poly(spec.map((s) => ({ c: s.c, v: K[s.k].sym })));
    const substituted = join(spec.map((s) => {
      const a = Math.abs(s.c);
      return { neg: s.c < 0, body: s.k === '' ? String(a) : (a === 1 ? '' : String(a)) + K[s.k].sub };
    }));
    const values = join(terms.map((t) => ({ neg: t.val < 0, body: String(Math.abs(t.val)) })));
    const cands = terms.map((t) => total - 2 * t.val).concat([total + 1, total - 1, total + 2, total - 2]);
    const o = numOpts('', total, cands);
    return Object.assign({
      ask: 'Evaluate when ' + V(p) + ' = ' + fmt(pv) + ' and ' + V(q) + ' = ' + fmt(qv),
      prompt: prompt,
      steps: [
        { say: 'Substitute the values', eq: substituted },
        { say: 'Work out each term', eq: values },
        { say: 'Add them up', eq: fmt(total) }
      ]
    }, o);
  }

  function genQuad(d) {
    const v = pick(VARS);
    let a = 1, r1, r2;
    do {
      if (d === 1) { r1 = rnd(1, 7); r2 = rnd(1, 7); }
      else if (d === 2) { r1 = nz(-9, 9); r2 = nz(-9, 9); }
      else { a = pick([2, 3]); r1 = nz(-6, 6); r2 = nz(-6, 6); }
    } while (r1 === r2);
    const b = -a * (r1 + r2), c = a * r1 * r2;
    const lo = Math.min(r1, r2), hi = Math.max(r1, r2);
    const fac = (r) => '(' + V(v) + ' ' + (r > 0 ? M : '+') + ' ' + Math.abs(r) + ')';
    const zero = (r) => V(v) + ' ' + (r > 0 ? M : '+') + ' ' + Math.abs(r) + ' = 0';
    const mk = (u, w) => {
      const l = Math.min(u, w), h = Math.max(u, w);
      return { key: l + ',' + h, html: V(v) + ' = ' + fmt(l) + ' or ' + fmt(h) };
    };
    const distinct = (c) => { const k = c.key.split(','); return k[0] !== k[1]; };
    const cands = [mk(-r1, -r2), mk(r1, -r2), mk(-r1, r2), mk(r1 + 1, r2), mk(r1, r2 - 1), mk(r1 - 1, r2 + 1)].filter(distinct);
    const filler = () => { let c; do { c = mk(r1 + nz(-3, 3), r2 + pick([-1, 0, 1])); } while (!distinct(c)); return c; };
    const o = buildOpts(mk(r1, r2), cands, filler);
    return Object.assign({
      ask: 'Find both solutions',
      prompt: poly([{ c: a, v: V(v) + SQ }, { c: b, v: V(v) }, { c: c, v: '' }]) + ' = 0',
      steps: [
        { say: a === 1 ? 'Factor the left side' : 'Factor out ' + a + ', then factor the rest', eq: (a === 1 ? '' : a) + fac(r1) + fac(r2) + ' = 0' },
        { say: 'Set each factor equal to zero', eq: zero(r1) + ' &nbsp;or&nbsp; ' + zero(r2) },
        { say: 'Solve each one', eq: V(v) + ' = ' + fmt(lo) + ' &nbsp;or&nbsp; ' + V(v) + ' = ' + fmt(hi) }
      ]
    }, o);
  }

  function genSystem(d) {
    const pq = pick(PAIRS), p = pq[0], q = pq[1];
    let a, c, b, x0, y0;
    if (d === 1) { a = 1; c = 1; b = 1; x0 = rnd(1, 9); y0 = rnd(1, 9); }
    else if (d === 2) { a = rnd(1, 4); c = rnd(1, 4); b = 1; x0 = nz(-7, 8); y0 = nz(-7, 8); }
    else { do { a = nz(-5, 6); c = nz(-5, 6); } while (a + c === 0); b = rnd(2, 5); x0 = nz(-8, 8); y0 = nz(-8, 8); }
    const s = a * x0 + b * y0, t = c * x0 - b * y0;
    const askP = Math.random() < 0.5;
    const L1 = poly([{ c: a, v: V(p) }, { c: b, v: V(q) }]) + ' = ' + fmt(s);
    const L2 = poly([{ c: c, v: V(p) }, { c: -b, v: V(q) }]) + ' = ' + fmt(t);
    const sum = a + c;
    const steps = [
      { say: 'Add the equations to cancel ' + V(q), eq: poly([{ c: sum, v: V(p) }]) + ' = ' + fmt(s + t) }
    ];
    if (sum !== 1) steps.push({ say: 'Divide both sides by ' + fmt(sum), eq: V(p) + ' = ' + fmt(x0) });
    if (!askP) {
      steps.push({ say: 'Put ' + V(p) + ' = ' + fmt(x0) + ' into the first equation', eq: poly([{ c: b, v: V(q) }, { c: a * x0, v: '' }]) + ' = ' + fmt(s) });
      steps.push({ say: 'Solve for ' + V(q), eq: V(q) + ' = ' + fmt(y0) });
    }
    const name = askP ? p : q;
    const ans = askP ? x0 : y0;
    const cands = askP ? [y0, -x0, s + t, x0 + 1, x0 - 1] : [x0, -y0, y0 + 1, y0 - 1, s - x0];
    const o = numOpts(V(name) + ' = ', ans, cands);
    return Object.assign({
      ask: 'Solve the system and find ' + V(name),
      prompt: '<span class="sys"><span class="brace" aria-hidden="true">{</span><span class="lines"><span>' + L1 + '</span><span>' + L2 + '</span></span></span>',
      steps: steps
    }, o);
  }

  /* ---- word problems ---- */
  function wordOpts(pre, ans, cands) {
    const mk = (n) => ({ key: String(n), html: pre + n });
    return buildOpts(mk(ans),
      cands.filter((c) => Number.isInteger(c) && c > 0).map(mk),
      () => { let n = ans + pick([-1, 1]) * rnd(1, 6); if (n <= 0) n = ans + rnd(1, 6); return mk(n); });
  }

  function wFee(d) {
    let a, b, x0;
    if (d === 1) { a = rnd(2, 6); b = rnd(2, 12); x0 = rnd(2, 9); }
    else { a = rnd(3, 12); b = rnd(5, 30); x0 = rnd(3, 15); }
    const c = a * x0 + b;
    const ctx = pick([
      { v: 'm', unit: 'miles', ask: 'How many miles was the ride?', story: `A taxi company charges a base fare of $${b} plus $${a} per mile. Dana's ride cost $${c} in total.` },
      { v: 'm', unit: 'months', ask: 'For how many months has she been a member?', story: `A gym charges a sign-up fee of $${b} plus $${a} each month. So far Priya has paid $${c} in total.` },
      { v: 'h', unit: 'hours', ask: 'How many hours did the job take?', story: `A plumber charges $${b} to come out plus $${a} for every hour of work. The final bill was $${c}.` },
      { v: 'g', unit: 'games', ask: 'How many games did he play?', story: `An arcade charges $${b} to get in plus $${a} per game. Theo paid $${c} in all.` }
    ]);
    const v = V(pick(VARS));
    return Object.assign({
      ask: ctx.ask,
      prompt: ctx.story,
      steps: [
        { say: 'Let ' + v + ' be the number of ' + ctx.unit + '.', eq: '' },
        { say: 'Write the total cost as an equation', eq: poly([{ c: a, v: v }, { c: b, v: '' }]) + ' = ' + c },
        { say: moveSay(b), eq: poly([{ c: a, v: v }]) + ' = ' + (c - b) },
        { say: 'Divide both sides by ' + a, eq: v + ' = ' + x0 }
      ]
    }, wordOpts('', x0, [c - b, c / a, (c + b) / a, x0 + 1, x0 - 1, x0 + 2]));
  }

  function wNumber(d) {
    const v = V(pick(VARS));
    if (d === 3) {
      const a = rnd(3, 9), c = rnd(1, a - 1), k = a - c, x0 = rnd(3, 14);
      const b = rnd(1, Math.min(15, k * x0 - 1)), e = k * x0 - b;
      const steps = [
        { say: 'Let ' + v + ' be the number.', eq: '' },
        { say: 'Write both results and set them equal', eq: poly([{ c: a, v: v }, { c: -b, v: '' }]) + ' = ' + poly([{ c: c, v: v }, { c: e, v: '' }]) },
        { say: moveSayV(c, v), eq: poly([{ c: k, v: v }, { c: -b, v: '' }]) + ' = ' + e },
        { say: moveSay(-b), eq: poly([{ c: k, v: v }]) + ' = ' + (e + b) },
        { say: 'Divide both sides by ' + k, eq: v + ' = ' + x0 }
      ];
      if (k === 1) steps.pop();
      return Object.assign({
        ask: 'What is the number?',
        prompt: `Multiplying a number by ${a} and then subtracting ${b} gives the same result as multiplying it by ${c} and then adding ${e}.`,
        steps: steps
      }, wordOpts('', x0, [(e - b) / k, (e + b) / (a + c), e + b, x0 + 1, x0 - 1]));
    }
    const dec = Math.random() < 0.5;
    const a = d === 1 ? rnd(2, 6) : rnd(3, 9);
    const x0 = d === 1 ? rnd(2, 9) : rnd(3, 15);
    const bmax = d === 1 ? 12 : 20;
    const b = dec ? rnd(1, Math.min(bmax, a * x0 - 1)) : rnd(1, bmax);
    const sg = dec ? -1 : 1;
    const c = a * x0 + sg * b;
    return Object.assign({
      ask: 'What is the number?',
      prompt: `${a} times a number, ${dec ? 'decreased' : 'increased'} by ${b}, equals ${c}.`,
      steps: [
        { say: 'Let ' + v + ' be the number.', eq: '' },
        { say: 'Write the sentence as an equation', eq: poly([{ c: a, v: v }, { c: sg * b, v: '' }]) + ' = ' + c },
        { say: moveSay(sg * b), eq: poly([{ c: a, v: v }]) + ' = ' + (a * x0) },
        { say: 'Divide both sides by ' + a, eq: v + ' = ' + x0 }
      ]
    }, wordOpts('', x0, [a * x0, (c + sg * b) / a, c / a, x0 + 1, x0 - 1]));
  }

  function wBonus(d) {
    const a = d === 1 ? rnd(2, 5) : rnd(3, 9);
    const b = d === 1 ? rnd(1, 4) : rnd(2, 6);
    const x0 = d === 1 ? rnd(3, 10) : rnd(4, 15);
    const f = a * (x0 + b);
    const ctx = pick([
      { v: 'c', pre: '', def: 'the number of cookies in one box', ask: 'How many cookies are in each box, not counting the extras?', story: `A bakery packs ${a} boxes of cookies. Every box holds the same number of cookies, plus ${b} extras on top. There are ${f} cookies altogether.` },
      { v: 'p', pre: '', def: 'the number of pencils in one pack', ask: 'How many pencils are in a pack before the free ones?', story: `A teacher hands out ${a} packs of pencils. Each pack has the same number of pencils, and ${b} free pencils are added to every pack. In all there are ${f} pencils.` },
      { v: 'm', pre: '$', def: 'the cost of one meal in dollars', ask: 'How much does each meal cost, before the tip?', story: `${a} friends each order the same meal and each add $${b} as a tip. Together they pay $${f}.` }
    ]);
    const v = V(pick(VARS));
    return Object.assign({
      ask: ctx.ask,
      prompt: ctx.story,
      steps: [
        { say: 'Let ' + v + ' be ' + ctx.def + '.', eq: '' },
        { say: 'Write the total as an equation', eq: a + '(' + v + ' + ' + b + ') = ' + f },
        { say: 'Divide both sides by ' + a, eq: v + ' + ' + b + ' = ' + (x0 + b) },
        { say: moveSay(b), eq: v + ' = ' + x0 }
      ]
    }, wordOpts(ctx.pre, x0, [x0 + b, x0 + 2 * b, x0 - b, (f - b) / a, x0 + 1, x0 - 1]));
  }

  function wPerimeter(d) {
    const x0 = d === 2 ? rnd(3, 14) : rnd(5, 30);
    const k = d === 2 ? rnd(2, 9) : rnd(2, 15);
    const P = 4 * x0 + 2 * k;
    const ctx = pick([
      { thing: 'garden', unit: 'metres' }, { thing: 'poster', unit: 'centimetres' },
      { thing: 'playground', unit: 'metres' }, { thing: 'photo frame', unit: 'centimetres' }
    ]);
    const w = V(pick(VARS));
    return Object.assign({
      ask: 'How wide is the ' + ctx.thing + ', in ' + ctx.unit + '?',
      prompt: `A rectangular ${ctx.thing} is ${k} ${ctx.unit} longer than it is wide. Its perimeter is ${P} ${ctx.unit}.`,
      steps: [
        { say: 'Let ' + w + ' be the width, so the length is ' + w + ' + ' + k + '.', eq: '' },
        { say: 'Perimeter = 2 × (width + length)', eq: '2(' + w + ' + (' + w + ' + ' + k + ')) = ' + P },
        { say: 'Combine like terms', eq: '4' + w + ' + ' + (2 * k) + ' = ' + P },
        { say: moveSay(2 * k), eq: '4' + w + ' = ' + (P - 2 * k) },
        { say: 'Divide both sides by 4', eq: w + ' = ' + x0 }
      ]
    }, wordOpts('', x0, [x0 + k, (P - k) / 2, P / 4, 2 * x0, x0 + 1, x0 - 1]));
  }

  function wSumDiff(d) {
    const x0 = d === 2 ? rnd(12, 40) : rnd(25, 80);
    const y0 = rnd(3, x0 - 2);
    const s = x0 + y0, df = x0 - y0;
    const ctx = pick([
      { L: 'x', S: 'y', def: 'Let <i>x</i> be Ana’s points and <i>y</i> be Ben’s points.', story: `Ana and Ben scored ${s} points together. Ana scored ${df} more points than Ben.`, askL: 'How many points did Ana score?', askS: 'How many points did Ben score?' },
      { L: 'x', S: 'y', def: 'Let <i>x</i> be the number of goats and <i>y</i> the number of cows.', story: `A farm has ${s} cows and goats in total. There are ${df} more goats than cows.`, askL: 'How many goats are there?', askS: 'How many cows are there?' },
      { L: 'x', S: 'y', def: 'Let <i>x</i> be the larger number and <i>y</i> the smaller number.', story: `Two numbers add up to ${s}. Their difference is ${df}.`, askL: 'What is the larger number?', askS: 'What is the smaller number?' },
      { L: 'x', S: 'y', def: 'Let <i>x</i> be Mia’s stickers and <i>y</i> be Noah’s stickers.', story: `Mia and Noah have ${s} stickers between them. Mia has ${df} more than Noah.`, askL: 'How many stickers does Mia have?', askS: 'How many stickers does Noah have?' }
    ]);
    const L = V(ctx.L), S = V(ctx.S);
    const askL = Math.random() < 0.5;
    const steps = [
      { say: ctx.def, eq: '' },
      { say: 'Write two equations', eq: '<span class="lines"><span>' + L + ' + ' + S + ' = ' + s + '</span><span>' + L + ' ' + M + ' ' + S + ' = ' + df + '</span></span>' }
    ];
    if (askL) {
      steps.push({ say: 'Add the equations to cancel ' + S, eq: '2' + L + ' = ' + (s + df) });
      steps.push({ say: 'Divide both sides by 2', eq: L + ' = ' + x0 });
    } else {
      steps.push({ say: 'Subtract the second equation from the first to cancel ' + L, eq: '2' + S + ' = ' + (s - df) });
      steps.push({ say: 'Divide both sides by 2', eq: S + ' = ' + y0 });
    }
    const o = askL
      ? wordOpts('', x0, [y0, s + df, s / 2, df, x0 + 1, x0 - 1])
      : wordOpts('', y0, [x0, s - df, s / 2, df, y0 + 1, y0 - 1]);
    return Object.assign({ ask: askL ? ctx.askL : ctx.askS, prompt: ctx.story, steps: steps }, o);
  }

  function wArea() {
    const p = rnd(3, 12), k = rnd(2, 8), A = p * (p + k);
    const ctx = pick([
      { thing: 'garden', unit: 'metres' }, { thing: 'poster', unit: 'centimetres' }, { thing: 'patio', unit: 'metres' }
    ]);
    const w = V(pick(VARS));
    return Object.assign({
      ask: 'What is the width of the ' + ctx.thing + ', in ' + ctx.unit + '?',
      prompt: `A rectangular ${ctx.thing} is ${k} ${ctx.unit} longer than it is wide. Its area is ${A} square ${ctx.unit}.`,
      steps: [
        { say: 'Let ' + w + ' be the width, so the length is ' + w + ' + ' + k + '.', eq: '' },
        { say: 'Area = width × length', eq: w + '(' + w + ' + ' + k + ') = ' + A },
        { say: 'Expand and move everything to one side', eq: poly([{ c: 1, v: w + SQ }, { c: k, v: w }, { c: -A, v: '' }]) + ' = 0' },
        { say: 'Factor', eq: '(' + w + ' ' + M + ' ' + p + ')(' + w + ' + ' + (p + k) + ') = 0' },
        { say: 'A width cannot be negative, so keep the positive solution', eq: w + ' = ' + p }
      ]
    }, wordOpts('', p, [p + k, p - 1, p + 1, k, A / k, p + 2]));
  }

  function wCompare(d) {
    const a = d === 2 ? rnd(4, 10) : rnd(5, 15);
    const c = rnd(1, a - 1), k = a - c;
    const x0 = d === 2 ? rnd(3, 10) : rnd(4, 16);
    const b = rnd(5, 30), e = b + k * x0;
    const ctx = pick([
      { v: 'm', unit: 'months', ask: 'After how many months will the two gyms have cost the same total?', story: `Gym A charges a joining fee of $${b} plus $${a} per month. Gym B charges a joining fee of $${e} plus $${c} per month.` },
      { v: 'h', unit: 'hours', ask: 'For how many hours of work do both plumbers charge the same total?', story: `Plumber A charges $${b} to come out plus $${a} per hour. Plumber B charges $${e} to come out plus $${c} per hour.` },
      { v: 'h', unit: 'hours', ask: 'After how many hours of riding is the total cost the same?', story: `Shop A rents a bike for a deposit of $${b} plus $${a} per hour. Shop B asks for a deposit of $${e} plus $${c} per hour.` },
      { v: 'g', unit: 'GB of data', ask: 'How many GB of data make the two plans cost the same?', story: `Phone plan A costs $${b} to set up plus $${a} per GB. Plan B costs $${e} to set up plus $${c} per GB.` }
    ]);
    const v = V(pick(VARS));
    const steps = [
      { say: 'Let ' + v + ' be the number of ' + ctx.unit + '.', eq: '' },
      { say: 'Set the two total costs equal', eq: poly([{ c: a, v: v }, { c: b, v: '' }]) + ' = ' + poly([{ c: c, v: v }, { c: e, v: '' }]) },
      { say: moveSayV(c, v), eq: poly([{ c: k, v: v }, { c: b, v: '' }]) + ' = ' + e },
      { say: moveSay(b), eq: poly([{ c: k, v: v }]) + ' = ' + (e - b) },
      { say: 'Divide both sides by ' + k, eq: v + ' = ' + x0 }
    ];
    if (k === 1) steps.pop();
    return Object.assign({ ask: ctx.ask, prompt: ctx.story, steps: steps },
      wordOpts('', x0, [(e + b) / k, (e - b) / (a + c), e - b, x0 + 1, x0 - 1]));
  }

  const WORD_POOL = {
    1: [wFee, wNumber, wBonus],
    2: [wFee, wNumber, wBonus, wPerimeter, wSumDiff, wCompare],
    3: [wNumber, wPerimeter, wSumDiff, wCompare, wArea, wBonus]
  };
  function genWord(d) {
    const f = pick(WORD_POOL[d]);
    const q = f(d);
    q.kind = 'word';
    q.tpl = f.name;
    return q;
  }

  /* ---- word problems with two unknowns, solved by substitution ---- */
  const lines2 = (a, b) => '<span class="lines"><span>' + a + '</span><span>' + b + '</span></span>';
  const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);

  function wsCount(d) {
    const lo = d === 1 ? 3 : d === 2 ? 5 : 8, hi = d === 1 ? 9 : d === 2 ? 16 : 30;
    const x0 = rnd(lo, hi), y0 = rnd(lo, hi);
    const ctx = pick([
      { u: 'x', v: 'y', prices: () => { const A = rnd(8, 15); return [A, rnd(4, A - 2)]; },
        def: 'Let <i>x</i> be the number of adult tickets and <i>y</i> the number of child tickets.',
        story: (n, A, C, T) => `A theatre sold ${n} tickets for one show. Adult tickets cost $${A} each and child tickets cost $${C} each. Total sales were $${T}.`,
        askU: 'How many adult tickets were sold?', askV: 'How many child tickets were sold?' },
      { u: 'x', v: 'y', prices: () => { const A = rnd(3, 6); return [A, rnd(2, A - 1)]; },
        def: 'Let <i>x</i> be the number of pens and <i>y</i> the number of notebooks.',
        story: (n, A, C, T) => `A school store sold ${n} items today, all pens or notebooks. Pens cost $${A} each and notebooks cost $${C} each. The store took in $${T}.`,
        askU: 'How many pens were sold?', askV: 'How many notebooks were sold?' },
      { u: 'x', v: 'y', prices: () => { const A = rnd(3, 5); return [A, rnd(2, A - 1)]; },
        def: 'Let <i>x</i> be the number of cookies and <i>y</i> the number of brownies.',
        story: (n, A, C, T) => `At a bake sale, ${n} treats were sold, only cookies and brownies. Cookies were $${A} each and brownies were $${C} each. The sale raised $${T}.`,
        askU: 'How many cookies were sold?', askV: 'How many brownies were sold?' },
      { u: 'x', v: 'y', prices: () => [10, 5],
        def: 'Let <i>x</i> be the number of dimes and <i>y</i> the number of nickels. A dime is worth 10 cents and a nickel is worth 5 cents.',
        story: (n, A, C, T) => `A jar holds ${n} coins, all dimes and nickels. Together the coins are worth ${T} cents.`,
        askU: 'How many dimes are in the jar?', askV: 'How many nickels are in the jar?' }
    ]);
    const pr = ctx.prices(), A = pr[0], C = pr[1];
    const n = x0 + y0, T = A * x0 + C * y0;
    const askU = Math.random() < 0.5;
    const us = V(ctx.u), vs = V(ctx.v);
    const xs = askU ? us : vs, ys = askU ? vs : us;
    const pX = askU ? A : C, pY = askU ? C : A;
    const ans = askU ? x0 : y0, other = askU ? y0 : x0;
    const termU = askU ? A + us : A + '(' + n + ' ' + M + ' ' + vs + ')';
    const termV = askU ? C + '(' + n + ' ' + M + ' ' + us + ')' : C + vs;
    const kk = pX - pY;
    const steps = [
      { say: ctx.def, eq: '' },
      { say: 'Write two equations', eq: lines2(us + ' + ' + vs + ' = ' + n, A + us + ' + ' + C + vs + ' = ' + T) },
      { say: 'Solve the first equation for ' + ys, eq: ys + ' = ' + n + ' ' + M + ' ' + xs },
      { say: 'Substitute into the second equation', eq: termU + ' + ' + termV + ' = ' + T },
      { say: 'Expand and combine like terms', eq: poly([{ c: kk, v: xs }, { c: pY * n, v: '' }]) + ' = ' + T },
      { say: moveSay(pY * n), eq: poly([{ c: kk, v: xs }]) + ' = ' + fmt(T - pY * n) },
      { say: 'Divide both sides by ' + fmt(kk), eq: xs + ' = ' + ans }
    ];
    if (kk === 1) steps.pop();
    return Object.assign({ ask: askU ? ctx.askU : ctx.askV, prompt: ctx.story(n, A, C, T), steps: steps },
      wordOpts('', ans, [other, n, T / (A + C), ans + 1, ans - 1, ans + 2]));
  }

  function wsRel(d) {
    const kind = d === 1 ? 'mult' : d === 2 ? pick(['mult', 'off']) : pick(['aff', 'aff', 'mult', 'off']);
    let k = 1, off = 0;
    if (kind === 'mult') k = d === 1 ? rnd(2, 5) : rnd(2, 6);
    if (kind === 'off') off = rnd(3, 15);
    if (kind === 'aff') { k = rnd(2, 5); off = rnd(2, 15); }
    const x0 = d === 1 ? rnd(3, 12) : rnd(4, 20);
    const y0 = k * x0 + off, n = x0 + y0;
    const ctx = pick([
      { X: 'x', Y: 'y', def: 'Let <i>x</i> be the brother’s age and <i>y</i> be Maya’s age.',
        intro: (t) => `The ages of Maya and her brother add up to ${t}.`,
        mult: (q) => `Maya is ${q} times as old as her brother.`,
        off: (o) => `Maya is ${o} years older than her brother.`,
        aff: (q, o) => `Maya’s age is ${o} more than ${q} times her brother’s age.`,
        askX: 'How old is her brother?', askY: 'How old is Maya?' },
      { X: 'x', Y: 'y', def: 'Let <i>x</i> be the shorter piece and <i>y</i> the longer piece, in metres.',
        intro: (t) => `A rope ${t} metres long is cut into two pieces.`,
        mult: (q) => `The longer piece is ${q} times as long as the shorter piece.`,
        off: (o) => `The longer piece is ${o} metres longer than the shorter piece.`,
        aff: (q, o) => `The longer piece is ${o} metres more than ${q} times the shorter piece.`,
        askX: 'How long is the shorter piece, in metres?', askY: 'How long is the longer piece, in metres?' },
      { X: 'x', Y: 'y', def: 'Let <i>x</i> be Jo’s stickers and <i>y</i> be Sam’s stickers.',
        intro: (t) => `Jo and Sam have ${t} stickers altogether.`,
        mult: (q) => `Sam has ${q} times as many stickers as Jo.`,
        off: (o) => `Sam has ${o} more stickers than Jo.`,
        aff: (q, o) => `Sam has ${o} more than ${q} times as many stickers as Jo.`,
        askX: 'How many stickers does Jo have?', askY: 'How many stickers does Sam have?' },
      { X: 'x', Y: 'y', def: 'Let <i>x</i> be Ava’s marbles and <i>y</i> be Leo’s marbles.',
        intro: (t) => `Ava and Leo have ${t} marbles between them.`,
        mult: (q) => `Leo has ${q} times as many marbles as Ava.`,
        off: (o) => `Leo has ${o} more marbles than Ava.`,
        aff: (q, o) => `Leo has ${o} more than ${q} times as many marbles as Ava.`,
        askX: 'How many marbles does Ava have?', askY: 'How many marbles does Leo have?' }
    ]);
    const rel = kind === 'mult' ? ctx.mult(k) : kind === 'off' ? ctx.off(off) : ctx.aff(k, off);
    const X = V(ctx.X), Yv = V(ctx.Y);
    const rhs = poly([{ c: k, v: X }, { c: off, v: '' }]);
    const askX = Math.random() < 0.5;
    const steps = [
      { say: ctx.def, eq: '' },
      { say: 'Write two equations', eq: lines2(Yv + ' = ' + rhs, X + ' + ' + Yv + ' = ' + n) },
      { say: 'Substitute the first equation into the second', eq: X + ' + ' + (off ? '(' + rhs + ')' : rhs) + ' = ' + n },
      { say: 'Combine like terms', eq: poly([{ c: 1 + k, v: X }, { c: off, v: '' }]) + ' = ' + n }
    ];
    if (off) steps.push({ say: moveSay(off), eq: poly([{ c: 1 + k, v: X }]) + ' = ' + (n - off) });
    steps.push({ say: 'Divide both sides by ' + (1 + k), eq: X + ' = ' + x0 });
    if (!askX) {
      steps.push({ say: 'Put ' + X + ' = ' + x0 + ' into the first equation', eq: Yv + ' = ' + (k === 1 ? x0 : k + '(' + x0 + ')') + (off ? ' + ' + off : '') });
      steps.push({ say: 'Calculate', eq: Yv + ' = ' + y0 });
    }
    const o = askX
      ? wordOpts('', x0, [y0, n, x0 + 1, x0 - 1, x0 + 2, n / (1 + k)])
      : wordOpts('', y0, [x0, n, y0 + 1, y0 - 1, k * x0, y0 + 2]);
    return Object.assign({ ask: askX ? ctx.askX : ctx.askY, prompt: ctx.intro(n) + ' ' + rel, steps: steps }, o);
  }

  function wsRect(d) {
    const k = d === 2 ? rnd(2, 4) : rnd(1, 4);
    const off = d === 2 ? 0 : rnd(1, 9);
    const x0 = d === 2 ? rnd(3, 12) : rnd(4, 20);
    const y0 = k * x0 + off, P = 2 * (x0 + y0);
    const ctx = pick([
      { thing: 'poster', unit: 'centimetres' }, { thing: 'garden', unit: 'metres' },
      { thing: 'photo frame', unit: 'centimetres' }, { thing: 'playground', unit: 'metres' }
    ]);
    const phrase = off === 0 ? k + ' times its width'
      : k === 1 ? off + ' ' + ctx.unit + ' more than its width'
        : off + ' ' + ctx.unit + ' more than ' + k + ' times its width';
    const w = V('x'), l = V('y');
    const rhs = poly([{ c: k, v: w }, { c: off, v: '' }]);
    const askW = Math.random() < 0.5;
    const steps = [
      { say: 'Let ' + w + ' be the width and ' + l + ' the length, in ' + ctx.unit + '.', eq: '' },
      { say: 'Write two equations', eq: lines2(l + ' = ' + rhs, '2' + l + ' + 2' + w + ' = ' + P) },
      { say: 'Substitute the first equation into the second', eq: '2(' + rhs + ') + 2' + w + ' = ' + P },
      { say: 'Expand and combine like terms', eq: poly([{ c: 2 * k + 2, v: w }, { c: 2 * off, v: '' }]) + ' = ' + P }
    ];
    if (off) steps.push({ say: moveSay(2 * off), eq: poly([{ c: 2 * k + 2, v: w }]) + ' = ' + (P - 2 * off) });
    steps.push({ say: 'Divide both sides by ' + (2 * k + 2), eq: w + ' = ' + x0 });
    if (!askW) {
      steps.push({ say: 'Put ' + w + ' = ' + x0 + ' into the first equation', eq: l + ' = ' + (k === 1 ? x0 : k + '(' + x0 + ')') + (off ? ' + ' + off : '') });
      steps.push({ say: 'Calculate', eq: l + ' = ' + y0 });
    }
    const o = askW
      ? wordOpts('', x0, [y0, x0 + 1, x0 - 1, P / 4, P / 2, x0 + 2])
      : wordOpts('', y0, [x0, y0 + 1, y0 - 1, k * x0, P / 2, y0 + 2]);
    return Object.assign({
      ask: askW ? 'What is the width, in ' + ctx.unit + '?' : 'What is the length, in ' + ctx.unit + '?',
      prompt: `A rectangular ${ctx.thing} has a perimeter of ${P} ${ctx.unit}. Its length is ${phrase}.`,
      steps: steps
    }, o);
  }

  function wsPrice(d) {
    const a = d === 2 ? rnd(1, 3) : rnd(2, 6), b = d === 2 ? rnd(1, 3) : rnd(2, 6);
    const x0 = d === 2 ? rnd(1, 6) : rnd(2, 12), off = d === 2 ? rnd(1, 4) : rnd(1, 9);
    const y0 = x0 + off, T = a * x0 + b * y0;
    const ctx = pick([
      { X: 'x', Y: 'y', def: 'Let <i>x</i> be the price of a pen and <i>y</i> the price of a notebook, in dollars.',
        story: () => `${plural(a, 'pen', 'pens')} and ${plural(b, 'notebook', 'notebooks')} cost $${T} in total. A notebook costs $${off} more than a pen.`,
        askX: 'What is the price of one pen?', askY: 'What is the price of one notebook?' },
      { X: 'x', Y: 'y', def: 'Let <i>x</i> be the price of a muffin and <i>y</i> the price of a coffee, in dollars.',
        story: () => `${plural(a, 'muffin', 'muffins')} and ${plural(b, 'coffee', 'coffees')} cost $${T} in total. A coffee costs $${off} more than a muffin.`,
        askX: 'What is the price of one muffin?', askY: 'What is the price of one coffee?' },
      { X: 'x', Y: 'y', def: 'Let <i>x</i> be the price of an apple and <i>y</i> the price of a mango, in dollars.',
        story: () => `${plural(a, 'apple', 'apples')} and ${plural(b, 'mango', 'mangoes')} cost $${T} in total. A mango costs $${off} more than an apple.`,
        askX: 'What is the price of one apple?', askY: 'What is the price of one mango?' }
    ]);
    const X = V(ctx.X), Yv = V(ctx.Y);
    const askX = Math.random() < 0.5;
    const steps = [
      { say: ctx.def, eq: '' },
      { say: 'Write two equations', eq: lines2(Yv + ' = ' + X + ' + ' + off, poly([{ c: a, v: X }, { c: b, v: Yv }]) + ' = ' + T) },
      { say: 'Substitute the first equation into the second', eq: (a === 1 ? '' : a) + X + ' + ' + (b === 1 ? '' : b) + '(' + X + ' + ' + off + ') = ' + T },
      { say: 'Expand and combine like terms', eq: poly([{ c: a + b, v: X }, { c: b * off, v: '' }]) + ' = ' + T },
      { say: moveSay(b * off), eq: poly([{ c: a + b, v: X }]) + ' = ' + (T - b * off) },
      { say: 'Divide both sides by ' + (a + b), eq: X + ' = ' + x0 }
    ];
    if (!askX) {
      steps.push({ say: 'Put ' + X + ' = ' + x0 + ' into the first equation', eq: Yv + ' = ' + x0 + ' + ' + off });
      steps.push({ say: 'Calculate', eq: Yv + ' = ' + y0 });
    }
    const o = askX
      ? wordOpts('$', x0, [y0, x0 + 1, x0 - 1, T / (a + b), x0 + 2])
      : wordOpts('$', y0, [x0, y0 + 1, y0 - 1, y0 + off, x0 + 2 * off]);
    return Object.assign({ ask: askX ? ctx.askX : ctx.askY, prompt: ctx.story(), steps: steps }, o);
  }

  const WS_POOL = { 1: [wsRel, wsCount], 2: [wsRel, wsCount, wsRect, wsPrice], 3: [wsRel, wsCount, wsRect, wsPrice] };
  function genWordSys(d) {
    const f = pick(WS_POOL[d]);
    const q = f(d);
    q.kind = 'word';
    q.note = 'Solve by substitution';
    q.tpl = f.name;
    return q;
  }

  const GEN = { two: genTwoStep, both: genBoth, brackets: genBrackets, subst: genSubst, quad: genQuad, system: genSystem, word: genWord, wsys: genWordSys };
  const TOPICS = Object.keys(GEN);

  function makeQuestion(topic, level) {
    const t = topic === 'mixed' ? pick(TOPICS) : topic;
    const q = GEN[t](level);
    q.topic = t;
    return q;
  }
  function makeRound(n, topic, level) {
    const out = [], seen = new Set();
    let guard = 0;
    while (out.length < n && guard++ < 400) {
      const q = makeQuestion(topic, level);
      const key = q.ask + '|' + q.prompt;
      if (seen.has(key)) continue;
      seen.add(key);
      out.push(q);
    }
    while (out.length < n) out.push(makeQuestion(topic, level));
    return out;
  }
  /* ==LOGIC-END== */

  /* ---------- UI ---------- */
  const TOPIC_LABELS = { mixed: 'Mixed', two: 'Two-step', both: 'Both sides', brackets: 'Brackets', subst: 'Substitution', quad: 'Quadratics', system: 'Systems', word: 'Word problems', wsys: 'Word systems' };
  const LEVELS = { 1: 'Easy', 2: 'Medium', 3: 'Hard' };
  const LETTERS = 'ABCD';
  const KEY = 'equation-drill-settings';
  const $ = (id) => document.getElementById(id);
  const card = $('card');

  function loadSettings() {
    const d = { topic: 'mixed', level: 2, n: 10 };
    try {
      const s = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (s) {
        if (TOPIC_LABELS[s.topic]) d.topic = s.topic;
        if ([1, 2, 3].indexOf(s.level) >= 0) d.level = s.level;
        if ([5, 10, 20].indexOf(s.n) >= 0) d.n = s.n;
      }
    } catch (e) { /* storage unavailable */ }
    return d;
  }
  function saveSettings() {
    try { localStorage.setItem(KEY, JSON.stringify(settings)); } catch (e) { /* ignore */ }
  }

  let settings = loadSettings();
  let round = null;

  function buildControls() {
    $('topics').innerHTML = Object.keys(TOPIC_LABELS).map((k) =>
      '<button type="button" class="chip" data-topic="' + k + '" aria-pressed="false">' + TOPIC_LABELS[k] + '</button>').join('');
    $('levels').innerHTML = [1, 2, 3].map((l) =>
      '<button type="button" class="chip" data-level="' + l + '" aria-pressed="false">' + LEVELS[l] + '</button>').join('');
  }
  function syncControls() {
    document.querySelectorAll('[data-topic]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.topic === settings.topic)));
    document.querySelectorAll('[data-level]').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.level === settings.level)));
    $('len').value = String(settings.n);
    $('kicker').textContent = 'Practice sheet · ' + LEVELS[settings.level] + ' · ' + TOPIC_LABELS[settings.topic];
  }

  function startRound(qs) {
    const list = qs || makeRound(settings.n, settings.topic, settings.level);
    round = { qs: list, res: list.map(() => null), i: 0, streak: 0, best: 0, done: false };
    renderAll();
  }

  function renderStats() {
    const answered = round.res.filter(Boolean).length;
    const ok = round.res.filter((r) => r && r.ok).length;
    $('st-score').textContent = String(ok);
    $('st-streak').textContent = String(round.streak);
    $('st-acc').textContent = answered ? Math.round(100 * ok / answered) + '%' : '—';
  }

  function renderQuestion() {
    const q = round.qs[round.i], r = round.res[round.i];
    const n = round.qs.length, last = round.i === n - 1;
    const pips = round.qs.map((_, k) => {
      const res = round.res[k];
      return '<li class="pip' + (k === round.i ? ' cur' : '') + (res ? (res.ok ? ' ok' : ' no') : '') + '"></li>';
    }).join('');
    const opts = q.options.map((o, k) => {
      let cls = 'opt', tag = '';
      if (r) {
        if (k === q.correctIndex) { cls += ' right'; tag = 'Correct'; }
        else if (k === r.chosen) { cls += ' wrong'; tag = 'Your answer'; }
      }
      return '<button type="button" class="' + cls + '" data-k="' + k + '"' + (r ? ' aria-disabled="true"' : '') + '>' +
        '<span class="key">' + LETTERS[k] + '</span><span class="val">' + o.html + '</span><span class="tag">' + tag + '</span></button>';
    }).join('');
    let below;
    if (r) {
      below = '<section class="feedback ' + (r.ok ? 'good' : 'bad') + '" aria-live="polite">' +
        '<h2>' + (r.ok ? 'Correct.' : 'Not quite. The answer is ' + LETTERS[q.correctIndex] + ', ' + q.options[q.correctIndex].html + '.') + '</h2>' +
        '<p class="glabel">Worked solution</p>' +
        '<ol class="steps">' + q.steps.map((s) => '<li' + (s.eq ? '' : ' class="solo"') + '><span class="say">' + s.say + '</span>' + (s.eq ? '<span class="math">' + s.eq + '</span>' : '') + '</li>').join('') + '</ol>' +
        '<button type="button" class="btn primary" id="next">' + (last ? 'See results' : 'Next question') + '</button></section>';
    } else {
      below = '<p class="hint"><span class="touch">Tap an answer.</span><span class="kbd">Press 1–4 or A–D to answer.</span></p>';
    }
    card.innerHTML =
      '<div class="progress"><ol class="pips" aria-hidden="true">' + pips + '</ol>' +
      '<p class="count">Question <b>' + (round.i + 1) + '</b> of ' + n + '</p></div>' +
      (q.kind === 'word'
        ? '<div class="story">' + (q.note ? '<p class="note">' + q.note + '</p>' : '') + '<p>' + q.prompt + '</p><p class="storyq">' + q.ask + '</p></div>'
        : '<p class="ask">' + q.ask + '</p><div class="equation">' + q.prompt + '</div>') +
      '<div class="options" role="group" aria-label="Answer choices">' + opts + '</div>' + below;
  }

  function renderDone() {
    const n = round.qs.length;
    const ok = round.res.filter((r) => r && r.ok).length;
    const pct = Math.round(100 * ok / n);
    const missed = [];
    round.qs.forEach((q, k) => { if (!round.res[k].ok) missed.push({ q: q, r: round.res[k] }); });
    const review = missed.length
      ? '<h2 class="subhead">Review the ' + missed.length + ' you missed</h2><ul class="missed">' + missed.map((m) =>
        '<li>' + (m.q.kind === 'word'
          ? '<div class="eqs wordtxt">' + m.q.prompt + ' <b>' + m.q.ask + '</b></div>'
          : '<p class="q">' + m.q.ask + '</p><div class="eqs">' + m.q.prompt + '</div>') +
        '<p class="cmp"><span class="bad">You chose</span> <span class="math">' + m.q.options[m.r.chosen].html + '</span> &middot; ' +
        '<span class="good">Correct</span> <span class="math">' + m.q.options[m.q.correctIndex].html + '</span></p></li>').join('') + '</ul>'
      : '<p class="perfect">Every answer was right.' + (settings.level < 3 ? ' Try a harder level next.' : '') + '</p>';
    card.innerHTML =
      '<div class="result"><p class="glabel">Round complete</p>' +
      '<p class="big"><span>' + ok + '</span><span class="of">/ ' + n + '</span></p>' +
      '<p class="sub">' + pct + '% correct &middot; best streak ' + round.best + ' &middot; ' + LEVELS[settings.level] + ' &middot; ' + TOPIC_LABELS[settings.topic] + '</p>' +
      review +
      '<div class="actions"><button type="button" class="btn primary" id="again">New round</button>' +
      (missed.length ? '<button type="button" class="btn ghost" id="retry">Retry missed (' + missed.length + ')</button>' : '') + '</div></div>';
  }

  function renderAll() {
    syncControls();
    renderStats();
    if (round.done) renderDone(); else renderQuestion();
  }

  const smooth = () => (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth');

  function answer(k) {
    if (round.done || round.res[round.i]) return;
    const q = round.qs[round.i];
    const ok = k === q.correctIndex;
    round.res[round.i] = { chosen: k, ok: ok };
    round.streak = ok ? round.streak + 1 : 0;
    round.best = Math.max(round.best, round.streak);
    renderAll();
    const nb = $('next');
    if (nb) {
      nb.focus({ preventScroll: true });
      nb.scrollIntoView({ block: 'nearest', behavior: smooth() });
    }
  }
  function next() {
    if (!round.res[round.i]) return;
    if (round.i < round.qs.length - 1) round.i++; else round.done = true;
    renderAll();
    if (card.getBoundingClientRect().top < 0) card.scrollIntoView({ block: 'start', behavior: smooth() });
  }
  function missedQs() { return round.qs.filter((q, k) => !round.res[k].ok); }

  card.addEventListener('click', (e) => {
    const opt = e.target.closest('.opt');
    if (opt) { answer(+opt.dataset.k); return; }
    const b = e.target.closest('button');
    if (!b) return;
    if (b.id === 'next') next();
    else if (b.id === 'again') { startRound(); if (card.getBoundingClientRect().top < 0) card.scrollIntoView({ block: 'start', behavior: smooth() }); }
    else if (b.id === 'retry') { startRound(missedQs()); if (card.getBoundingClientRect().top < 0) card.scrollIntoView({ block: 'start', behavior: smooth() }); }
  });

  $('topics').addEventListener('click', (e) => {
    const b = e.target.closest('[data-topic]');
    if (!b) return;
    settings.topic = b.dataset.topic; saveSettings(); startRound();
  });
  $('levels').addEventListener('click', (e) => {
    const b = e.target.closest('[data-level]');
    if (!b) return;
    settings.level = +b.dataset.level; saveSettings(); startRound();
  });
  $('len').addEventListener('change', (e) => {
    settings.n = +e.target.value; saveSettings(); startRound();
  });
  $('new').addEventListener('click', () => startRound());

  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey || !round || round.done) return;
    const t = e.target, tag = t && t.tagName;
    if (tag === 'SELECT' || tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (t && t.closest && t.closest('.calc')) return;
    const q = round.qs[round.i];
    if (!round.res[round.i]) {
      let k = -1;
      if (/^[1-4]$/.test(e.key)) k = +e.key - 1;
      else if (/^[a-dA-D]$/.test(e.key)) k = e.key.toLowerCase().charCodeAt(0) - 97;
      if (k >= 0 && k < q.options.length) { e.preventDefault(); answer(k); }
    } else if (e.key === 'n' || e.key === 'N') {
      e.preventDefault(); next();
    } else if (e.key === 'Enter' && tag !== 'BUTTON' && tag !== 'A') {
      e.preventDefault(); next();
    }
  });

  /* ---------- Calculator ---------- */
  /* ==CALC-START== */
  function calcEval(src, ans) {
    const s = String(src).replace(/\s+/g, '');
    const toks = [];
    let i = 0;
    while (i < s.length) {
      const ch = s[i], low = s.slice(i, i + 4).toLowerCase();
      if (/[0-9.]/.test(ch)) {
        let j = i;
        while (j < s.length && /[0-9.]/.test(s[j])) j++;
        const t = s.slice(i, j);
        if (t === '.' || (t.match(/\./g) || []).length > 1) throw new Error('number');
        toks.push({ t: 'n', v: parseFloat(t) });
        i = j;
      } else if (low.slice(0, 3) === 'ans') { toks.push({ t: 'n', v: ans }); i += 3; }
      else if (low === 'sqrt') { toks.push({ t: 'r' }); i += 4; }
      else if (low.slice(0, 2) === 'pi') { toks.push({ t: 'n', v: Math.PI }); i += 2; }
      else if (ch === 'π') { toks.push({ t: 'n', v: Math.PI }); i++; }
      else if (ch === '+') { toks.push({ t: '+' }); i++; }
      else if (ch === '-' || ch === '−') { toks.push({ t: '-' }); i++; }
      else if (ch === '*' || ch === '×') { toks.push({ t: '*' }); i++; }
      else if (ch === '/' || ch === '÷') { toks.push({ t: '/' }); i++; }
      else if (ch === '^') { toks.push({ t: '^' }); i++; }
      else if (ch === '(' || ch === ')') { toks.push({ t: ch }); i++; }
      else if (ch === '√') { toks.push({ t: 'r' }); i++; }
      else throw new Error('character');
    }
    if (!toks.length) throw new Error('empty');
    let p = 0;
    const peek = () => (p < toks.length ? toks[p].t : null);
    function expr() {
      let v = term();
      while (peek() === '+' || peek() === '-') {
        const op = toks[p++].t;
        const r = term();
        v = op === '+' ? v + r : v - r;
      }
      return v;
    }
    function term() {
      let v = unary();
      for (;;) {
        const k = peek();
        if (k === '*' || k === '/') { p++; const r = unary(); v = k === '*' ? v * r : v / r; }
        else if (k === 'n' || k === '(' || k === 'r') { v = v * power(); }
        else break;
      }
      return v;
    }
    function unary() {
      const k = peek();
      if (k === '-') { p++; return -unary(); }
      if (k === '+') { p++; return unary(); }
      return power();
    }
    function power() {
      const b = atom();
      if (peek() === '^') { p++; return Math.pow(b, unary()); }
      return b;
    }
    function atom() {
      const k = peek();
      if (k === 'n') return toks[p++].v;
      if (k === '(') {
        p++;
        const v = expr();
        if (peek() === ')') p++; else if (peek() !== null) throw new Error('paren');
        return v;
      }
      if (k === 'r') { p++; const v = atom(); if (v < 0) throw new Error('root'); return Math.sqrt(v); }
      throw new Error('syntax');
    }
    const result = expr();
    if (p < toks.length) throw new Error('extra');
    if (!isFinite(result)) throw new Error('math');
    return result;
  }
  function calcFmt(v) { return String(parseFloat(v.toPrecision(15))).replace(/-/g, '−'); }
  /* ==CALC-END== */

  const cin = $('calc-in'), cout = $('calc-out'), chist = $('calc-hist'), ckeys = $('calc-keys');
  const calc = { ans: 0, fresh: false, hist: [] };
  const KEYS = [
    ['C', 'clear', 'fn', 'Clear'], ['⌫', 'back', 'fn', 'Backspace'], ['(', '(', 'fn', 'Open bracket'], [')', ')', 'fn', 'Close bracket'],
    ['<i>x</i><sup>2</sup>', '^2', 'fn', 'Square'], ['√', '√(', 'fn', 'Square root'], ['^', '^', 'fn', 'Power'], ['÷', '÷', 'op', 'Divide'],
    ['7', '7', '', '7'], ['8', '8', '', '8'], ['9', '9', '', '9'], ['×', '×', 'op', 'Multiply'],
    ['4', '4', '', '4'], ['5', '5', '', '5'], ['6', '6', '', '6'], ['−', '−', 'op', 'Minus'],
    ['1', '1', '', '1'], ['2', '2', '', '2'], ['3', '3', '', '3'], ['+', '+', 'op', 'Plus'],
    ['ANS', 'ANS', 'fn', 'Previous answer'], ['0', '0', '', '0'], ['.', '.', '', 'Decimal point'], ['=', 'eq', 'eqk', 'Equals']
  ];
  ckeys.innerHTML = KEYS.map((k) =>
    '<button type="button" class="k ' + k[2] + '" data-v="' + k[1] + '" aria-label="' + k[3] + '">' + k[0] + '</button>').join('');

  function calcPreview() {
    const v = cin.value.trim();
    cout.textContent = '';
    if (!v) return;
    try {
      const s = calcFmt(calcEval(v, calc.ans));
      if (s !== v.replace(/-/g, '−')) cout.textContent = '= ' + s;
    } catch (e) { /* incomplete expression: show nothing */ }
  }
  function calcInsert(text) {
    if (calc.fresh) { if (/^[0-9.(√A]/.test(text)) cin.value = ''; calc.fresh = false; }
    const a = cin.selectionStart == null ? cin.value.length : cin.selectionStart;
    const b = cin.selectionEnd == null ? a : cin.selectionEnd;
    cin.value = cin.value.slice(0, a) + text + cin.value.slice(b);
    const pos = a + text.length;
    cin.setSelectionRange(pos, pos);
    calcPreview();
  }
  function calcBack() {
    calc.fresh = false;
    const a = cin.selectionStart == null ? cin.value.length : cin.selectionStart;
    const b = cin.selectionEnd == null ? a : cin.selectionEnd;
    let from = a, to = b;
    if (a === b) from = Math.max(0, a - 1);
    cin.value = cin.value.slice(0, from) + cin.value.slice(to);
    cin.setSelectionRange(from, from);
    calcPreview();
  }
  function renderHist() {
    chist.innerHTML = calc.hist.map((h) =>
      '<li><span class="he">' + h.e.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</span><button type="button" class="hr" data-r="' + h.r + '" aria-label="Use result ' + h.r + '">= ' + h.r + '</button></li>').join('');
  }
  function calcEquals() {
    const v = cin.value.trim();
    if (!v) return;
    try {
      const r = calcEval(v, calc.ans), s = calcFmt(r);
      calc.ans = r;
      calc.hist.unshift({ e: v, r: s });
      calc.hist = calc.hist.slice(0, 5);
      cin.value = s;
      calc.fresh = true;
      cout.textContent = '';
      renderHist();
    } catch (e) { cout.textContent = 'Check the expression'; }
  }
  function setCalc(open) {
    document.body.classList.toggle('calc-open', open);
    $('calc-toggle').setAttribute('aria-expanded', String(open));
    if (open && window.matchMedia && matchMedia('(hover: hover)').matches) cin.focus();
  }

  ckeys.addEventListener('click', (e) => {
    const b = e.target.closest('.k');
    if (!b) return;
    const v = b.dataset.v;
    if (v === 'clear') { cin.value = ''; calc.fresh = false; cout.textContent = ''; }
    else if (v === 'back') calcBack();
    else if (v === 'eq') calcEquals();
    else calcInsert(v);
  });
  chist.addEventListener('click', (e) => {
    const b = e.target.closest('.hr');
    if (!b) return;
    calc.fresh = false;
    calcInsert(b.dataset.r);
  });
  cin.addEventListener('input', () => { calc.fresh = false; calcPreview(); });
  cin.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); calcEquals(); } });
  $('calc-toggle').addEventListener('click', () => setCalc(!document.body.classList.contains('calc-open')));
  $('calc-close').addEventListener('click', () => { setCalc(false); $('calc-toggle').focus(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.body.classList.contains('calc-open')) { setCalc(false); $('calc-toggle').focus(); }
  });

  if (window.ResizeObserver) {
    new ResizeObserver(() => {
      document.documentElement.style.setProperty('--calc-h', $('calc').offsetHeight + 'px');
    }).observe($('calc'));
  }

  buildControls();
  startRound();
})();
</script>
<script>
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
